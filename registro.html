<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow · Crear cuenta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- INICIO wrapper -->
<div id="wrapper" class="centrado">
  <main>
    <section class="tarjeta-auth" id="tarjetaRegistro">

      <div class="marca-auth">
        <span class="logo-marca" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
        </span>
        <strong>StudyFlow</strong>
      </div>

      <h1>Crear cuenta</h1>

      <form id="formRegistro" novalidate>
        <div class="campo" id="campoNombre">
          <label for="nombreRegistro">Nombre completo</label>
          <input type="text" id="nombreRegistro" name="nombre" placeholder="Tu nombre" autocomplete="name">
          <p class="mensaje-error">Ingresa tu nombre completo.</p>
        </div>

        <div class="campo" id="campoCorreoRegistro">
          <label for="correoRegistro">Correo electrónico</label>
          <input type="email" id="correoRegistro" name="correo" placeholder="correo@ejemplo.com" autocomplete="email">
          <p class="mensaje-error">Ingresa un correo electrónico válido.</p>
        </div>

        <div class="campo" id="campoPasswordRegistro">
          <label for="passwordRegistro">Contraseña</label>
          <input type="password" id="passwordRegistro" name="password" placeholder="••••••••" autocomplete="new-password">
          <p class="mensaje-error">La contraseña debe tener al menos 6 caracteres.</p>
        </div>

        <div class="campo" id="campoConfirmar">
          <label for="confirmarRegistro">Confirmar contraseña</label>
          <input type="password" id="confirmarRegistro" name="confirmar" placeholder="••••••••" autocomplete="new-password">
          <p class="mensaje-error">Las contraseñas no coinciden.</p>
        </div>

        <label class="campo-check" for="terminosRegistro">
          <input type="checkbox" id="terminosRegistro" name="terminos">
          Acepto términos y condiciones
        </label>

        <button type="submit" class="boton-primario" id="botonRegistro">Crear cuenta</button>
      </form>

      <a href="index.html" class="enlace-auth">¿Tienes cuenta? Inicia sesión</a>

    </section>
  </main>
</div>
<!-- FIN wrapper -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
