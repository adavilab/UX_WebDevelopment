<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StudyFlow · Nueva entrega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- INICIO wrapper -->
<div id="wrapper" class="con-sidebar">

  <!-- INICIO header (barra lateral) -->
  <div id="header">
    <header>
      <div id="identidad">
        <h1>
          <a href="calendario.html">
            <span class="logo-marca" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
            </span>
            <strong>StudyFlow</strong>
          </a>
        </h1>
      </div>

      <div id="menu">
        <nav>
          <ul>
            <li>
              <a href="calendario.html" class="activo">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <span>Calendario</span>
              </a>
            </li>
            <li>
              <a href="materias.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
                <span>Materias</span>
              </a>
            </li>
            <li>
              <a href="sugerencias.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg>
                <span>Sugerencias</span>
              </a>
            </li>
            <li>
              <a href="perfil.html">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span>Perfil</span>
              </a>
            </li>
          </ul>
        </nav>
      </div>
    </header>

    <!-- INICIO footer (pie de la barra lateral) -->
    <div id="footer">
      <footer>
        <ul>
          <li>
            <a href="#">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 2-3 4"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
              <span>Ayuda y Soporte</span>
            </a>
          </li>
          <li>
            <a href="index.html" id="cerrarSesionPerfil">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              <span>Cerrar sesión</span>
            </a>
          </li>
        </ul>
      </footer>
    </div>
    <!-- FIN footer (pie de la barra lateral) -->
  </div>
  <!-- FIN header (barra lateral) -->

  <!-- INICIO contenidos -->
  <div id="contenidos">
    <main>

      <div class="barra-superior">
        <div></div>
        <div class="usuario-actual">
          <div class="datos-usuario">
            <strong class="nombre-usuario"></strong>
            <span class="rol-usuario">Estudiante</span>
          </div>
          <div class="avatar"></div>
        </div>
      </div>

      <section id="seccionNuevaEntrega" class="contenedor-estrecho">
        <a href="calendario.html" class="enlace-volver">‹ Volver a calendario</a>

        <form id="formNuevaEntrega" novalidate>
          <div class="tarjeta-formulario">
            <h1 class="titulo-formulario" id="tituloFormEntrega">Nueva entrega</h1>
            <hr class="divisor">

            <div class="grupo-campo" id="campoMateriaEntrega">
              <label for="materiaEntrega">Materia</label>
              <div class="select-envoltorio">
                <select id="materiaEntrega"></select>
              </div>
              <a href="crear-materia.html" class="enlace-crear-materia">+ Crear Materia</a>
              <p class="error-campo">Selecciona una materia.</p>
            </div>

            <div class="grupo-campo" id="campoTituloEntrega">
              <label for="tituloEntrega">Nombre de la tarea</label>
              <input type="text" id="tituloEntrega" placeholder="Ej. Parcial de Cálculo">
              <p class="error-campo">Ingresa el nombre de la tarea.</p>
            </div>

            <div class="grupo-campo" id="campoFechaEntrega">
              <label for="fechaEntrega">Fecha límite</label>
              <div class="campo-fecha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
                <input type="date" id="fechaEntrega">
              </div>
              <p class="error-campo">Elige una fecha de hoy en adelante.</p>
            </div>

            <div class="grupo-campo">
              <label for="pomodorosEntrega">Pomodoros estimados</label>
              <div class="contador-pomodoros">
                <button type="button" class="boton-contador" id="restarPomodoro" aria-label="Restar un Pomodoro">&minus;</button>
                <input type="text" id="pomodorosEntrega" value="3" readonly>
                <button type="button" class="boton-contador" id="sumarPomodoro" aria-label="Sumar un Pomodoro">+</button>
              </div>
            </div>

            <button type="submit" class="boton-primario boton-ancho" id="botonGuardarEntrega">Guardar</button>
          </div>
        </form>
      </section>

    </main>
  </div>
  <!-- FIN contenidos -->

</div>
<!-- FIN wrapper -->

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/datos.js"></script>
<script src="js/menu.js"></script>
</body>
</html>
